name: Build Kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 zip git device-tree-compiler lld

      - name: Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang ~/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Check configs
        run: ls -la arch/arm64/configs/vendor/trinket-perf_defconfig arch/arm64/configs/vendor/xiaomi-trinket.config arch/arm64/configs/vendor/ginkgo.config

      - name: Configure
        run: |
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/trinket-perf_defconfig vendor/xiaomi-trinket.config vendor/ginkgo.config
          scripts/config --file out/.config \
            -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_LOAD \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL -d MODVERSIONS
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig
          grep -E "CONFIG_MODULES|CONFIG_MODULE_SIG|MODVERSIONS|FORCE_LOAD" out/.config

      - name: Build
        run: |
          make -k -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: List outputs
        if: always()
        run: |
          ls -la out/arch/arm64/boot/ || true
          ls out/arch/arm64/boot/dts/xiaomi/ out/arch/arm64/boot/dts/qcom/ 2>/dev/null | grep -i trinket || true

      - name: Debug dtc
        if: always()
        run: |
          clang --version | head -1
          out/scripts/dtc/dtc --version || true
          clang -E -nostdinc \
            -I arch/arm64/boot/dts -I arch/arm64/boot/dts/include -I include \
            -undef -D__DTS__ -x assembler-with-cpp \
            -o /tmp/ov.dts arch/arm64/boot/dts/xiaomi/ginkgo-trinket-overlay.dts || true
          ls -la /tmp/ov.dts || true
          out/scripts/dtc/dtc -@ -I dts -O dtb -o /dev/null /tmp/ov.dts 2>&1 | head -5 || true
          N=$(grep -n 'trinket-thermal-overlay.dtsi' /tmp/ov.dts | head -1 | cut -d: -f1)
          echo "marker line: $N"
          if [ -n "$N" ]; then sed -n "$((N-15)),$((N+20))p" /tmp/ov.dts; fi

      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git
          sed -i 's/^device.name1=.*/device.name1=ginkgo/; s/^device.name2=.*/device.name2=willow/' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|; s/^is_slot_device=.*/is_slot_device=0;/' anykernel.sh
          cp ../out/arch/arm64/boot/Image.gz-dtb . || cp ../out/arch/arm64/boot/Image.gz .
          zip -r9 ../kernel-ginkgo.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-ginkgo
          path: kernel-ginkgo.zip
